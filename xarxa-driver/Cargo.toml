[package]
name = "xarxa-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Driver trait for the `xarxa` TCP/IP network stack."
documentation = "https://docs.rs/xarxa-driver/"
homepage = "https://github.com/embassy-rs/xarxa"
repository = "https://github.com/embassy-rs/xarxa.git"
readme = "README.md"
keywords = ["ip", "tcp", "udp", "ethernet", "network"]
categories = ["embedded", "network-programming"]
license = "0BSD"

[dependencies]
defmt = { version = "1.0.1", optional = true }

[features]
defmt = ["dep:defmt"]

# Enable the `PacketMeta::id` field.
"packetmeta-id" = []
# Let the stack expose a resolved route and let the device classify it before
# lazy TX backing is requested.
"tx-egress-metadata" = []
# Enable the `PacketMeta::timestamp` and `PacketMeta::request_timestamp` fields, and
# `Device::poll_tx_timestamp`.
#
# Transmit timestamps are correlated back to the packet that produced them by
# `PacketMeta::id`, so this requires `packetmeta-id`.
"packetmeta-timestamp" = ["packetmeta-id"]
